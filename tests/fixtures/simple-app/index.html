<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Bug Hunter Test Fixture</title>
  </head>
  <body>
    <h1 id="heading">AI Bug Hunter Fixture</h1>

    <form id="login-form">
      <label>
        Email
        <input type="text" id="email" name="email" />
      </label>
      <label>
        Password
        <input type="password" id="password" name="password" />
      </label>
      <label>
        Role
        <select id="role" name="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
          <option value="guest">Guest</option>
        </select>
      </label>
      <button type="button" id="submit-btn" onclick="handleSubmit()">Submit</button>
    </form>

    <div id="result" style="display: none;"></div>
    <div id="delayed" style="display: none;">Delayed content</div>

    <button type="button" id="trigger-console-error" onclick="triggerConsoleError()">
      Trigger console error
    </button>
    <button type="button" id="trigger-page-error" onclick="triggerPageError()">
      Trigger page error
    </button>
    <button type="button" id="trigger-500" onclick="trigger500()">Trigger 500</button>
    <button type="button" id="trigger-abort" onclick="triggerAbort()">Trigger abort</button>
    <div id="network-done"></div>

    <script>
      // Emit a benign console.log on load so console-capture tests have deterministic content.
      console.log('fixture-loaded');

      function handleSubmit() {
        var email = document.getElementById('email').value;
        var role = document.getElementById('role').value;
        var r = document.getElementById('result');
        r.textContent = 'Submitted: ' + email + ' / ' + role;
        r.style.display = 'block';
        r.id = 'result-success';
      }

      function triggerConsoleError() {
        console.error('deliberate-console-error');
        var m = document.createElement('div');
        m.id = 'console-error-emitted';
        m.textContent = 'console error emitted';
        document.body.appendChild(m);
      }

      function triggerPageError() {
        setTimeout(function () {
          throw new Error('deliberate-page-error');
        }, 0);
        var m = document.createElement('div');
        m.id = 'page-error-scheduled';
        m.textContent = 'page error scheduled';
        document.body.appendChild(m);
      }

      function trigger500() {
        fetch('/api/error').finally(function () {
          document.getElementById('network-done').textContent = 'done-500';
        });
      }

      function triggerAbort() {
        fetch('/api/abort').catch(function () {}).finally(function () {
          document.getElementById('network-done').textContent = 'done-abort';
        });
      }

      document.getElementById('email').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          var m = document.createElement('div');
          m.id = 'enter-pressed';
          m.textContent = 'Enter was pressed';
          document.body.appendChild(m);
        }
      });
    </script>
  </body>
</html>
